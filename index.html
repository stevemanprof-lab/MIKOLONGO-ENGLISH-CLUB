  <title>Mikolongo English Club</title><meta name="theme-color" content="#0a2463"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>

  <div class="container">

    <!-- ============================================================
    HEADER – JOYEUX
    ============================================================ -->
    <div class="top"><h1>🎤 MIKOLONGO ENGLISH CLUB<small>Écoute → Parle → Répète</small></h1>
<div id="userBar" style="display:none;text-align:right"><b id="uName"></b><br><small id="uPts"></small><br><button class="sm ghost" id="logoutBtn">Déconnexion</button></div></div>
<div id="authScreen" class="card auth"><div class="tabs"><button class="on" id="tLogin">Connexion</button><button id="tReg">Inscription</button></div>
<form id="authForm" autocomplete="on"><div id="regFields" style="display:none"><div class="row2"><div><label>Nom</label><input id="fLast" required></div><div><label>Prénom</label><input id="fFirst" required></div></div>
<label>Classe</label><input id="fClass" list="classes" placeholder="ex : 2nde A, Tle D" required><datalist id="classes"><option>2nde A<option>2nde B<option>1ère A<option>1ère B<option>Tle A1<option>Tle A2<option>Tle B<option>Tle C<option>Tle D</datalist></div>
<label>Numéro de téléphone</label><input id="fPhone" type="tel" inputmode="tel" required placeholder="ex : 077 00 00 00">
<label>Mot de passe (6 caractères min.)</label><input id="fPass" type="password" minlength="6" required>
<div id="codeBox" style="display:none"><label>Code d'accès du club</label><input id="fCode" inputmode="numeric" autocomplete="off"></div>
<div class="err" id="authErr"></div><button id="authBtn" style="width:100%">Se connecter</button></form></div>
<div id="msgBox" style="display:none" class="card"><h2>📩 Messages du club</h2><div id="msgList"></div></div>
<!-- HOME SCREEN
    ============================================================ -->
    <div id="homeScreen" class="home-screen" style="display:none">
      <h2>📚 Choisis une unité</h2><div class="bar" style="margin-bottom:14px"><i id="allBar" style="width:0"></i></div>
      <div class="text-grid" id="textGrid">
        <!-- Généré dynamiquement -->
      </div>
    </div>

    <!-- ============================================================
    PRACTICE SCREEN
    ============================================================ -->
    <div id="practiceScreen" class="practice-screen">

      <button id="backToHomeBtn" class="back-btn">⬅️ Retour</button>

      <div class="card">

        <div id="textHeader" class="text-header"></div>

        <div id="micStatus" class="mic-status waiting">
          🎤 Appuie sur "Parler" pour activer le micro
        </div>

        <div id="compatWarning" class="compat-warning"></div>

        <div class="controls">
          <button id="playBtn">🔊 Écouter</button>
          <button id="repeatBtn">🎤 Parler</button>
          <button id="nextBtn" class="outline" disabled>⏩ Suivant</button>
          <button id="resetBtn" style="display:none">🔄 Reset</button>
        </div>

        <div class="sentence-box">
          <div class="sentence-text" id="sentenceText">Chargement...</div>
          <div class="sentence-translation" id="sentenceTranslation"></div>
        </div>

        <div class="visualizer">
          <canvas id="voiceCanvas" width="400" height="70"></canvas>
          <div class="status" id="voiceStatus">⚪ Prêt</div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-stats">
          <span>📈 Progression</span>
          <span id="progressText">0%</span>
        </div>

        <div id="feedback" class="feedback feedback-info">
          💡 Appuie sur "Parler" puis répète la phrase
        </div>

      </div>
    </div>
  </div>

    const backToHomeBtn = document.getElementById('backToHomeBtn');
    const textHeader = document.getElementById('textHeader');
    const sentenceEl = document.getElementById('sentenceText');
    const translationEl = document.getElementById('sentenceTranslation');
    const playBtn = document.getElementById('playBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const voiceStatus = document.getElementById('voiceStatus');
    const feedbackDiv = document.getElementById('feedback');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const micStatus = document.getElementById('micStatus');
    const compatWarning = document.getElementById('compatWarning');

    // =============================================================
    // 3. FONCTIONS UTILITAIRES
    // =============================================================
    function resizeCanvas() {
      canvas.width = Math.min(canvas.parentElement.clientWidth - 40, 400);
      canvas.height = 70;
    }
    window.addEventListener('resize', resizeCanvas);

    let progMap={},lockedSet=new Set(),ME=null;
    function loadProgress(){const n=sentences.length;progress=(progMap[currentTextId]||[]).slice(0,n);while(progress.length<n)progress.push(false);
      const f=progress.indexOf(false);currentIndex=f<0?0:f;updateUI();}
    function saveProgress(){progMap[currentTextId]=progress.slice();updateUI();}
    function totals(){let v=0;for(const k in progMap)v+=progMap[k].filter(Boolean).length;return v}
    function refreshHeader(){const v=totals(),t=Object.values(textsData).reduce((a,u)=>a+u.sentences.length,0);
      document.getElementById('uPts').textContent=v+'/'+t+' phrases';document.getElementById('allBar').style.width=Math.round(v/t*100)+'%';}
    function updateUI() {
      if (sentences.length === 0) return;
      let done = progress.filter(v => v === true).length;
      let percent = Math.round((done / sentences.length) * 100);
      progressFill.style.width = percent + '%';
      progressText.innerText = `${done}/${sentences.length} (${percent}%)`;
      if (sentences[currentIndex]) {
        sentenceEl.innerText = sentences[currentIndex].en;
        translationEl.innerText = sentences[currentIndex].fr;
      }
      nextBtn.disabled = !progress[currentIndex];
      if (progress[currentIndex]) nextBtn.classList.add('success');
      else nextBtn.classList.remove('success');
    }

    function markCurrentDone() {
      if (!progress[currentIndex]) {
        progress[currentIndex] = true;
        saveProgress();
        showFeedback(`✅ Phrase ${currentIndex+1} validée !`, 'success');
        return true;
      }
      return false;
    }

    function showFeedback(msg, type = 'info') {
      let className = '';
      if (type === 'success') className = 'feedback-success';
      else if (type === 'error') className = 'feedback-error';
      else if (type === 'warning') className = 'feedback-warning';
      else className = 'feedback-info';
      feedbackDiv.innerHTML = msg;
      feedbackDiv.className = `feedback ${className}`;
    }

    // =============================================================
    // 4. SYNTHÈSE VOCALE (anglais)
    // =============================================================
    function speak(text, onEnd) {
      if (!window.speechSynthesis) {
        showFeedback("Lecture non disponible", "error");
        return;
      }
      try {
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        utterance.onend = () => { if (typeof onEnd === 'function') onEnd(); };
        utterance.onerror = () => { if (typeof onEnd === 'function') onEnd(); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.error("Speech error:", e);
        showFeedback("Erreur de lecture", "error");
        if (typeof onEnd === 'function') onEnd();
      }
    }

    function playCurrent() {
      if (!sentences[currentIndex]) return;
      speak(sentences[currentIndex].en);
      showFeedback(`🔊 Écoute - ${currentIndex+1}/${sentences.length}`, 'info');
    }

    function playBeep() {
      try {
        let ac = new(window.AudioContext || window.webkitAudioContext)();
        let osc = ac.createOscillator();
        let gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.1;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + 0.3);
        osc.stop(ac.currentTime + 0.3);
        setTimeout(() => ac.close(), 400);
      } catch (e) { console.log("Beep skipped"); }
    }

    // =============================================================
    // 5. VISUALISEUR
    // =============================================================
    function startVisualization() {
      if (animationId) cancelAnimationFrame(animationId);
      let time = 0;

      function draw() {
        if (!isListening) {
          ctx.fillStyle = '#1c142e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return;
        }
        ctx.fillStyle = '#1c142e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#ffb347';
        ctx.lineWidth = 3;
        let amp = 18 + Math.sin(time * 0.5) * 6;
        for (let x = 0; x < canvas.width; x += 4) {
          let y = canvas.height / 2 + Math.sin(x * 0.04 + time) * amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        time += 0.12;
        animationId = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopVisualization() {
      isListening = false;
      if (animationId) cancelAnimationFrame(animationId);
      ctx.fillStyle = '#1c142e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // =============================================================
    // 6. RECONNAISSANCE VOCALE (cible = anglais)
    // =============================================================
    function calculateSimilarity(spoken, target) {
      let a = spoken.toLowerCase().replace(/[^\w\s]/g, '').trim();
      let b = target.toLowerCase().replace(/[^\w\s]/g, '').trim();
      if (a === b) return 1;
      if (a.length === 0 || b.length === 0) return 0;

      let wordsA = a.split(/\s+/);
      let wordsB = b.split(/\s+/);

      let lengthDiff = Math.abs(wordsA.length - wordsB.length);
      let lengthPenalty = Math.max(0, 1 - (lengthDiff / Math.max(wordsA.length, wordsB.length)));

      let matches = 0;
      for (let wa of wordsA) {
        let bestMatch = 0;
        for (let wb of wordsB) {
          if (wb === wa) { bestMatch = 1; break; }
          if (wa.includes(wb) && wa.length > 3) bestMatch = Math.max(bestMatch, 0.85);
          if (wb.includes(wa) && wb.length > 3) bestMatch = Math.max(bestMatch, 0.85);
          if (wa.length > 4 && wb.length > 4) {
            if (wa[0] === wb[0] && wa[wa.length - 1] === wb[wb.length - 1]) {
              bestMatch = Math.max(bestMatch, 0.6);
            }
          }
        }
        matches += bestMatch;
      }

      let ratio = (matches / Math.max(wordsA.length, wordsB.length)) * lengthPenalty;
      return Math.min(ratio + 0.1, 1);
    }

    function startListening() {
      const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecog) {
        showFeedback("Reconnaissance vocale non supportée", "error");
        compatWarning.classList.add('show');
        return;
      }

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecog();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        voiceStatus.innerHTML = '🎤🔴 Écoute...';
        voiceStatus.className = 'status listening';
        repeatBtn.textContent = '⏹️ Arrêter';
        repeatBtn.classList.add('recording');
        startVisualization();
        micStatus.innerHTML = '🎤 Parle maintenant !';
        micStatus.className = 'mic-status';
      };

      recognition.onresult = (event) => {
        let transcript = event.results[0][0].transcript;
        evaluate(transcript);
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          micStatus.innerHTML = '🎤❌ Micro non autorisé';
          micStatus.className = 'mic-status error';
          showFeedback("Autorise l'accès au microphone", "error");
        } else if (event.error === 'no-speech') {
          showFeedback("Aucun son détecté. Parle plus fort !", "warning");
        } else if (event.error === 'audio-capture') {
          showFeedback("Microphone non trouvé", "error");
        } else {
          showFeedback(`Erreur: ${event.error}`, "error");
        }
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
        voiceStatus.innerHTML = '⚪ Prêt';
        voiceStatus.className = '';
        repeatBtn.textContent = '🎤 Parler';
        repeatBtn.classList.remove('recording');
      };

      try {
        recognition.start();
        setTimeout(() => {
          if (recognition && isListening) {
            try { recognition.stop(); } catch (e) {}
          }
        }, 15000);
      } catch (e) {
        showFeedback("Appuie à nouveau sur Parler", "warning");
        repeatBtn.textContent = '🎤 Parler';
        repeatBtn.classList.remove('recording');
      }
    }

    function stopListening() {
      isListening = false;
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
        recognition = null;
      }
      stopVisualization();
      voiceStatus.innerHTML = '⚪ Prêt';
      voiceStatus.className = '';
      repeatBtn.textContent = '🎤 Parler';
      repeatBtn.classList.remove('recording');
    }

    function evaluate(spoken) {
      if (!sentences[currentIndex]) return;
      const target = sentences[currentIndex].en;
      const sim = calculateSimilarity(spoken, target);
      const percent = Math.round(sim * 100);
      sb.rpc('record_attempt',{p_unit:currentTextId,p_idx:currentIndex,p_score:percent}).then(({error})=>{if(error){showFeedback(error.message.includes('locked')?'🔒 Unité verrouillée':error.message.includes('blocked')?'⛔ Accès suspendu':'⚠️ Connexion perdue : résultat non enregistré','error')}else refreshHeader()});

      voiceStatus.innerHTML = `🎤✅ ${percent}%`;
      voiceStatus.className = 'status success';

      if (sim >= 0.65) {
        showFeedback(`✅ Excellent ! ${percent}%`, 'success');
        const validated = markCurrentDone();
        if (validated && currentIndex + 1 < sentences.length) {
          setTimeout(() => {
            currentIndex++;
            saveProgress();
            updateUI();
            showFeedback(`📖 Phrase ${currentIndex+1}/${sentences.length}`, 'info');
          }, 2000);
        } else if (validated && currentIndex + 1 >= sentences.length) {
          setTimeout(() => showFeedback("🏆 Félicitations ! Unité terminée !", "success"), 1500);
        }
      } else if (sim >= 0.45) {
        showFeedback(`👍 ${percent}% - Encore un effort`, 'warning');
      } else {
        showFeedback(`📚 ${percent}% - Réécoute et réessaie`, 'error');
      }
    }

    function repeatSequence() {
      if (isListening) {
        stopListening();
        return;
      }
      if (!sentences[currentIndex]) return;
      showFeedback("🔊 Écoute...", "info");
      speak(sentences[currentIndex].en, () => {
        setTimeout(() => {
          playBeep();
          showFeedback("🎤 Parle maintenant !", "warning");
          setTimeout(() => {
            startListening();
          }, 300);
        }, 300);
      });
    }

    function nextSegment() {
      if (progress[currentIndex]) {
        if (currentIndex + 1 < sentences.length) {
          currentIndex++;
          saveProgress();
          updateUI();
          showFeedback(`📖 Phrase ${currentIndex+1}/${sentences.length}`, 'info');
        } else {
          showFeedback("🎉 Unité terminée !", "success");
        }
      } else {
        showFeedback("⚠️ Valide d'abord cette phrase", "warning");
      }
    }

    function resetProgress() {
      if (confirm("Réinitialiser la progression ?")) {
        progress = new Array(sentences.length).fill(false);
        currentIndex = 0;
        saveProgress();
        updateUI();
        showFeedback("Progression réinitialisée", "info");
      }
    }

    // =============================================================
    // 7. CHARGEMENT D'UNE UNITÉ
    // =============================================================
    function loadText(textId) {
      currentTextId = textId;
      const data = textsData[textId];
      if (!data || lockedSet.has(textId)) return;
      sentences = data.sentences.slice();
      if (sentences.length === 0) {
        sentences = [{ en: "(Aucune phrase)", fr: "(Aucune traduction)" }];
      }
      textHeader.innerHTML = `<h3>${data.title} (${sentences.length} phrases)</h3>`;
      loadProgress();
      resizeCanvas();
      homeScreen.style.display = 'none';
      practiceScreen.style.display = 'block';
      if (recognition) { try { recognition.stop(); } catch (e) {} }
      stopListening();
    }

    // =============================================================
    // 8. CONSTRUCTION DE L'ÉCRAN D'ACCUEIL
    // =============================================================
    function buildHomeScreen() {
      textGrid.innerHTML = '';
      for (let [id, data] of Object.entries(textsData)) {
        const d=(progMap[id]||[]).filter(Boolean).length,n=data.sentences.length,lk=lockedSet.has(id);
        let card = document.createElement('div');
        card.className = 'text-card'+(lk?' locked':'');
        card.innerHTML = `<h3>${data.title}</h3><p>${lk?'🔒 Verrouillée par le club':data.tag}</p><div class="bar"><i style="width:${d/n*100}%"></i></div><p>${d}/${n} phrases</p>`;
        card.onclick = () => loadText(id);
        textGrid.appendChild(card);
      }
      refreshHeader();
    }

    // =============================================================
    // 9. ÉVÉNEMENTS
    // =============================================================
    playBtn.onclick = playCurrent;
    repeatBtn.onclick = repeatSequence;
    nextBtn.onclick = nextSegment;
    resetBtn.onclick = resetProgress;
    backToHomeBtn.onclick = () => {
      buildHomeScreen();homeScreen.style.display = 'block';
      practiceScreen.style.display = 'none';
      if (recognition) { try { recognition.stop(); } catch (e) {} }
      stopListening();
    };

    document.addEventListener('keydown', (e) => {
      if (practiceScreen.style.display !== 'block') return;
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        playCurrent();
      }
      if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        repeatSequence();
      }
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        nextSegment();
      }
    });

    // =============================================================
    // 10. INITIALISATION
    // =============================================================
    resizeCanvas();
    // ---------- Authentification ----------
    const $=id=>document.getElementById(id);let reg=false;
    function mode(r){reg=r;$('regFields').style.display=$('codeBox').style.display=r?'block':'none';$('tReg').className=r?'on':'';$('tLogin').className=r?'':'on';
      $('authBtn').textContent=r?"Créer mon compte":'Se connecter';$('authErr').textContent='';
      for(const i of ['fLast','fFirst','fClass','fCode'])$(i).required=r;}
    $('tLogin').onclick=e=>{e.preventDefault();mode(false)};$('tReg').onclick=e=>{e.preventDefault();mode(true)};
    $('authForm').onsubmit=async e=>{e.preventDefault();const b=$('authBtn');b.disabled=true;$('authErr').textContent='';
      const phone=normPhone($('fPhone').value);
      if(phone.length<8||phone.length>12){$('authErr').textContent='Numéro de téléphone invalide.';b.disabled=false;return}
      const email=emailOf(phone),password=$('fPass').value;let r;
      if(reg){r=await sb.auth.signUp({email,password,options:{data:{last_name:$('fLast').value,first_name:$('fFirst').value,class_name:$('fClass').value,phone,club_code:$('fCode').value.trim()}}});
        if(r.error)$('authErr').textContent=/already|registered/i.test(r.error.message)?'Ce numéro est déjà inscrit : connecte-toi.':'Inscription refusée : vérifie le code du club.';}
      else{r=await sb.auth.signInWithPassword({email,password});if(r.error)$('authErr').textContent='Numéro ou mot de passe incorrect.';}
      b.disabled=false;if(!r.error)start();};
    $('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
    async function start(){
      const{data:{session}}=await sb.auth.getSession();if(!session)return;
      const{data:me}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
      if(!me||me.status==='blocked'){await sb.auth.signOut();$('authErr').textContent='Accès suspendu. Contacte le responsable du club.';return}
      if(me.role==='admin'){location.href='admin.html';return}
      ME=me;$('uName').textContent=me.first_name+' '+me.last_name;$('userBar').style.display='block';$('authScreen').style.display='none';
      const[p,l,m]=await Promise.all([sb.from('sentence_progress').select('unit_id,idx,validated').eq('user_id',me.id),sb.from('locked_units').select('unit_id'),
        sb.from('messages').select('body,created_at').order('created_at',{ascending:false}).limit(10)]);
      progMap={};(p.data||[]).forEach(r=>{(progMap[r.unit_id]=progMap[r.unit_id]||[])[r.idx]=r.validated});
      for(const k in progMap)progMap[k]=Array.from(progMap[k],v=>!!v);
      lockedSet=new Set((l.data||[]).map(r=>r.unit_id));
      if(m.data&&m.data.length){$('msgBox').style.display='block';$('msgList').innerHTML=m.data.map(x=>`<div class="msg">${x.body.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}<br><small>${new Date(x.created_at).toLocaleDateString('fr-FR')}</small></div>`).join('')}
      buildHomeScreen();homeScreen.style.display='block';}
    mode(false);
    start();
  </script>

</body>
